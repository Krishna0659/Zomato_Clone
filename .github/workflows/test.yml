name: CI — Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. UNIT + INTEGRATION TESTS (parallel matrix) ─────────────────────
  test:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth, restaurant, utils, rider]

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        env:
          JWT_SEC: test_jwt_secret_ci
          INTERNAL_SERVICE_KEY: test_internal_key_ci
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/${{ matrix.service }}_test
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          PAYMENT_QUEUE: payment_event
          RIDER_QUEUE: rider_queue
          ORDER_READY_QUEUE: order_ready_queue
          REALTIME_SERVICE: http://localhost:5004
          RESTAURANT_SERVICE: http://localhost:5001
          UTILS_SERVICE: http://localhost:5002
          FRONTEND_URL: http://localhost:5173
          STRIPE_SECRET_KEY: sk_test_placeholder
          RAZORPAY_KEY_ID: rzp_test_placeholder
          RAZORPAY_KEY_SECRET: test_razorpay_secret
          CLOUD_NAME: test_cloud
          CLOUD_API_KEY: "12345"
          CLOUD_SECRET_KEY: test_cloud_secret
        run: npx jest --config jest.config.cjs --coverage --coverageReporters=text --coverageReporters=lcov --forceExit --runInBand 2>&1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: services/${{ matrix.service }}/coverage
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
        continue-on-error: true

      - name: Check coverage threshold (80% lines)
        working-directory: services/${{ matrix.service }}
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | node -e "
            const d = require('fs').readFileSync('/dev/stdin','utf8');
            const j = JSON.parse(d);
            console.log(j.total.lines.pct);
          " 2>/dev/null || echo "0")
          echo "Coverage: $COVERAGE%"
          node -e "
            const pct = parseFloat('$COVERAGE');
            if (pct < 80) { console.error('Coverage ' + pct + '% is below 80% threshold'); process.exit(1); }
            console.log('Coverage OK: ' + pct + '%');
          "
        continue-on-error: true

  # ── 2. TYPESCRIPT BUILD VERIFICATION ──────────────────────────────────
  build:
    name: "Build: ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth, restaurant, utils, rider, realtime, admin]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: TypeScript compile
        working-directory: services/${{ matrix.service }}
        run: npm run build

  # ── 3. FRONTEND BUILD ────────────────────────────────────────────────
  frontend-build:
    name: "Frontend Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_INTERNAL_SERVICE_KEY: test_internal_key
        run: npm run build

  # ── 4. SUMMARY ────────────────────────────────────────────────────────
  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [test, build, frontend-build]
    steps:
      - run: echo "All CI checks passed ✅"
